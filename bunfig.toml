[test]
# NOTE: this `timeout` covers *test bodies* only — bun does NOT apply it to
# beforeAll/beforeEach/afterAll/afterEach hooks (verified on bun 1.3.14:
# an 8s hook still fails at the 5s default with `timeout = 60_000` here;
# hookTimeout / BUN_TEST_TIMEOUT / BUN_TIMEOUT are ignored too). Hooks get
# the same 60s ceiling from `./test/helpers/hook-timeout-preload.ts`
# instead, so the ceiling holds whether tests run through
# scripts/run-unit-shard.sh (which also passes `--timeout=60000`) or via
# a bare `bun test <file>`.
#
# 60s is the empirical ceiling we observed for PGLite WASM cold start +
# initSchema() (85 migrations), which runs 5-20s on loaded machines.
timeout = 60_000

# v0.37 fix wave: pin gateway defaults to legacy OpenAI/1536 BEFORE any
# test runs, so the 20+ test files with hardcoded 1536-d Float32Array
# fixtures still match the schema. v0.37's production default is ZE/1280;
# tests that want the new default call configureGateway() explicitly in
# their own beforeAll.
#
# hook-timeout-preload must come FIRST so every later `import ... from
# 'bun:test'` (including legacy-embedding-preload's own beforeEach) sees
# the timeout-injecting wrapper.
preload = [
  "./test/helpers/hook-timeout-preload.ts",
  "./test/helpers/legacy-embedding-preload.ts",
]
