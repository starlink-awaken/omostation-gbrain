name: CR-CI-RUNNER-COST

# 守的是**覆盖增量**，不是账单：macOS/Windows 腿必须覆盖默认 OS 腿拿不到的东西。
# 本仓是 public 仓 ⇒ Actions 分钟免费（含 macOS），成本不是这里的理由。
# 与父仓 omostation 的 CR-CI-RUNNER-COST 同一份守门 (bin/gac/check-runner-cost.py, 无父仓 import)。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runner-cost:
    name: runner 成本守门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pyyaml
        run: python3 -m pip install --quiet pyyaml
      - name: Scan workflows for paid OS runners
        run: python3 bin/gac/check-runner-cost.py
